# Run the unit tests on every push. These tests only use fake logs and fake CSV
# data, so they need no GPU and never start torchrun.
name: tests

on: push

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install requirements (CPU-only PyTorch, much smaller than the CUDA build)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
